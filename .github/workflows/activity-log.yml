name: Update activity log
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: TheDanniCraft/activity-log@v1
        with:
          GITHUB_USERNAME: zlkNx16
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
